<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplicativo Gestão de atividade - AR</title>
    <meta name="description" content="Uma plataforma robusta para gestão de projetos e tarefas, com dashboard executivo, relatórios gerados por IA e acompanhamento detalhado de equipe." />
    <meta property="og:title" content="Aplicativo Gestão de atividade - AR" />
    <meta property="og:description" content="Uma plataforma robusta para gestão de projetos e tarefas, com dashboard executivo, relatórios gerados por IA e acompanhamento detalhado de equipe." />
    <!-- PWA & Mobile Web App Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CTVacinas" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="shortcut icon" href="/favicon-32x32.png" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                dark: '#1e293b',    // slate-800
                primary: '#0d9488', // teal-600
                accent: '#14b8a6',  // teal-500
                light: '#f8fafc',   // slate-50
              }
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
            },
            animation: {
              in: 'animate-in .5s ease-out',
              'in-slow': 'animate-in .8s ease-out',
            },
            keyframes: {
              'animate-in': {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body { background-color: #f8fafc; color: #1e293b; }
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      
      @media print {
        /* Force color backgrounds to print */
        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          color-adjust: exact !important;
        }

        body.is-printing-project #root > div > aside,
        body.is-printing-project #root > div > main > header,
        body.is-printing-project .project-manager-header,
        body.is-printing-project .project-list-container,
        body.is-printing-project .no-print {
          display: none !important;
        }

        body.is-printing-project {
          background-color: white !important;
        }

        body.is-printing-project #root,
        body.is-printing-project #root > div,
        body.is-printing-project #root > div > main {
          display: block !important;
          width: 100% !important;
          height: auto !important;
          margin: 0 !important;
          padding: 0 !important;
          overflow: visible !important;
        }

        body.is-printing-project .printable-content {
          position: static !important;
          width: 100% !important;
          height: auto !important;
          border: none !important;
          box-shadow: none !important;
          animation: none !important;
          padding: 0 !important;
          margin: 0 !important;
        }
        
        body.is-printing-project h3 {
          font-size: 1.25rem;
        }
        
        body.is-printing-visual-board #root > div > aside,
        body.is-printing-visual-board #root > div > main > header,
        body.is-printing-visual-board .visual-board-header {
          display: none !important;
        }
        
        body.is-printing-visual-board #root,
        body.is-printing-visual-board #root > div,
        body.is-printing-visual-board #root > div > main {
           display: block !important;
           width: 100% !important;
           height: auto !important;
           margin: 0 !important;
           padding: 0 !important;
           overflow: visible !important;
        }

        /* Gantt View Overrides to print complete contents */
        body.is-printing-project .h-\[700px\],
        body.is-printing-project .flex-col.h-\[700px\],
        body.is-printing-project div.gantt-container {
          height: auto !important;
          min-height: auto !important;
          max-height: none !important;
          overflow: visible !important;
        }

        body.is-printing-project div.flex-1.overflow-hidden,
        body.is-printing-project .overflow-y-auto,
        body.is-printing-project .overflow-x-hidden,
        body.is-printing-project .overflow-auto,
        body.is-printing-project .custom-scrollbar,
        body.is-printing-project .scrollbar-none {
          overflow: visible !important;
          height: auto !important;
          max-height: none !important;
        }

        body.is-printing-project .flex.flex-1.overflow-hidden.relative {
          height: auto !important;
          display: flex !important;
          flex-direction: row !important;
          overflow: visible !important;
        }

        body.is-printing-project div[ref="listRef"],
        body.is-printing-project div[ref="timelineRef"] {
          overflow: visible !important;
          height: auto !important;
        }

        body.is-printing-project .sticky {
          position: static !important;
        }

        @page {
          size: A4 landscape;
          margin: 15mm;
        }
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "recharts": "https://esm.sh/recharts@^2.12.7",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",

    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",

    "@/": "./",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.3"
  }
}
</script>
  </head>

    <div id="root"></div>

</html>
