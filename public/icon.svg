<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background with squircle shape -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  
  <!-- Subtle accent circle -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" stroke-dasharray="12 10" />

  <!-- Central Shield & Vaccine Emblem -->
  <g filter="url(#shadow)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Shield Outline -->
    <path d="M256 90 L370 140 C370 260 256 360 256 390 C256 360 142 260 142 140 Z" fill="rgba(255,255,255,0.15)" stroke-width="16" />
    
    <!-- Medical Cross in Shield -->
    <path d="M256 160 V280" stroke-width="20" stroke="#ffffff" />
    <path d="M196 220 H316" stroke-width="20" stroke="#ffffff" />

    <!-- Stylized DNA / Molecular Orbit Nodes -->
    <circle cx="170" cy="170" r="14" fill="#ffffff" stroke="none" />
    <circle cx="342" cy="170" r="14" fill="#ffffff" stroke="none" />
    <circle cx="256" cy="330" r="14" fill="#ffffff" stroke="none" />
  </g>

  <!-- Typography CTVACINAS -->
  <text x="256" y="445" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="4" text-anchor="middle">CTVACINAS</text>
</svg>
